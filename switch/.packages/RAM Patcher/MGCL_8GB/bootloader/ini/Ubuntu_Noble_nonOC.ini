[config]
autoboot=0
autoboot_list=0
bootwait=0
backlight=100
autohosoff=0
autonogc=0
updater2p=0
bootprotect=0
noticker=0

[Ubuntu_Noble]
l4t=1
boot_prefixes=/switchroot/ubuntu-noble/
id=SWR-NOB
r2p_action=bootloader
logopath=bootloader/bootlogo/bootlogo_ubuntu.bmp
icon=bootloader/res/Ubuntu-Noble_hue.bmp
usb3force=1
;dvfsb=1
;gpu_dvfsc=1
;oc=1
;max_cpu_freq=1966000
;max_gpu_freq=1228000
;ram_oc=2500000


